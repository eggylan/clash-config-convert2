# mihomo (Clash Meta) 懒人配置
# 版本 V0.2-20151116
# 仓库地址：https://github.com/lzcmaro/clash-config-convert
# 感谢clash懒人配置（https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33）的贡献


# 延迟检测 URL
p: &p
  type: http
  # 自动更新订阅时间，单位为秒
  interval: 86400
  # 订阅节点可用性检查
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    # 节点连通性检测时间，单位为秒
    interval: 1800
    # 节点超时延迟，单位为毫秒
    timeout: 2000
    # 节点自动切换差值，单位为毫秒
    tolerance: 300

# 基础配置
# --------------------------------------------------
# 如果你是小白，那么你只需要修改分割线以内的内容
# 其他部分保持不动即可

# 也可以把分割线以内的内容粘贴到您使用代理工具的「覆写」功能，然后在覆写中进行修改
# 使用覆写时可以直接将此配置文件作为订阅链接进行订阅
# https://gist.githubusercontent.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/raw/config.yaml

# 如果你需要使用大于两个机场，在下方 `use` 处添加 `订阅三` （名字可以自己取），然后在 `proxy-providers` 照例添加订阅链接即可
# 反之，如果你只需要使用一个，那么将 `订阅二` 前添加 `#` 进行注释即可

# 订阅名，记得修改成自己的
# 添删订阅在这里和下方订阅链接依葫芦画瓢就行
use: &use
  type: select
  use: 
    - {{SUB_NAME}}
    # - 本地配置

# 订阅链接
# 对于订阅来说，path 为选填项，但建议启用
# 本地配置可以只填 path
proxy-providers:
  {{SUB_NAME}}:
    <<: *p
    # path: ./proxy_provider/订阅一.yaml
    url: "{{SUB_URL}}"
    # 如需要为该订阅组节点添加前缀，取消下面两行注释
    # override:
      # additional-prefix: "[订阅一]"

  # 本地配置:
    # <<: *p
    # path: ./proxy_provider/本地配置.yaml
    # 如需要为该订阅组节点添加前缀，取消下面两行注释
    # override:
      # additional-prefix: "[本地配置]"

# 小白请不要继续随意修改以下设置
# 若需修改请参阅文档 https://wiki.metacubex.one
# --------------------------------------------------

#节点过滤
# --------------------------------------------------
过滤节点: &GL "跳转|长期|导入|节点|流量|轮询|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|失联|到期|JC|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|页面|提示|特别|访问|支持|教程|关注|更新|作者|加入|.com|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author"
openai: &OPENAI "香港|🇭🇰|HK|Hong|跳转|长期|导入|节点|流量|轮询|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|失联|到期|JC|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|页面|提示|特别|访问|支持|教程|关注|更新|作者|加入|.com|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author"
# --------------------------------------------------

# 规则订阅
rule-providers:
  # 秋风广告拦截规则
  秋风广告:
    type: http
    # domain 纯域名格式 | classical 经典型模式，包含 DOMAIN-SUFFIX 等，主要看该规则集返回的数据格式
    behavior: domain
    format: yaml
    # path可为空(仅限clash.meta 1.15.0以上版本)
    path: ./rule_provider/AWAvenue-Ads.yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml"
    # 更新周期：86400 秒（24小时）
    interval: 86400

mode: rule
# ipv6 支持
ipv6: true
log-level: info
# 允许局域网连接
allow-lan: true
# socks5/http 端口
mixed-port: 7890
# Meta 内核特性 https://wiki.metacubex.one/config/general
# 统一延迟
# 更换延迟计算方式,去除握手等额外延迟
unified-delay: true
# TCP 并发
# 同时对所有ip进行连接，返回延迟最低的地址
tcp-concurrent: true
# 外部控制端口
external-controller: :9090

geodata-mode: true

# Geo 数据库下载地址
# 源地址 https://github.com/MetaCubeX/meta-rules-dat
# 可以更换镜像站但不要更换其他数据库，可能导致无法启动
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# 进程匹配模式
# 路由器上请设置为 off
# always 开启，强制匹配所有进程
# strict 默认，由 Clash 判断是否开启
# off 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

# 缓解移动设备耗电问题
# https://github.com/vernesong/OpenClash/issues/2614
keep-alive-interval: 1800

# 全局客户端指纹
global-client-fingerprint: random # 随机指纹

# 缓存
profile:
  store-selected: true
  store-fake-ip: true

# tun 模式
tun:
  enable: false  # enable 'true'
  stack: system  # or 'gvisor'
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# dns 设置
dns:
  enable: true
  ipv6: true
  use-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - 'geosite:cn'
    - '+.lan'
    - '+.local'
    # FCM 相关服务，避免 fake-ip 误伤
    - "*.googleapis.com"
    - "*.googleusercontent.com"
    - "*.gstatic.com"
    - "*.google.com"
    - "*.telegram.org"

  # 当 nameserver 或 nameserver-policy 没有匹配到特定域名时，或者配置中没有 fallback 时，会使用 default-nameserver 来解析
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114

  # 默认使用国内 DNS（加速国内访问）
  nameserver:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'

  # 回退 DNS（当主上游失败时使用国际可用 DoH/DoT）
  fallback:
    # ip 方式容易被干扰、阻止
    #- 'tls://1.1.1.1'
    #- 'tls://8.8.8.8'
    - 'https://one.one.one.one/dns-query' # Cloudflare DoH (走 443 端口)
    - 'https://dns.google/dns-query'      # Google DoH (走 443 端口)
    - 'https://doh.pub/dns-query'         # 阿里云的 DoH 备用，通常用于国内解析

  # 特殊域名走专用解析策略
  nameserver-policy:
    'geosite:cn':  # 国内网站优先国内 DNS
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
    'geosite:gfw':  # 被墙网站走国际 DNS
      - 'tls://dns.google'
      - 'tls://cloudflare-dns.com'
    '+.facebook.com': https://dns.google/dns-query
    '+.youtube.com': https://dns.google/dns-query
    # Google / FCM / Telegram 相关请求强制走可信DNS
    "+.googleapis.com": https://dns.google/dns-query
    "+.firebaseio.com": https://dns.google/dns-query
    "+.googleusercontent.com": https://dns.google/dns-query
    "+.gstatic.com": https://dns.google/dns-query
    "+.google.com": https://dns.google/dns-query
    "+.telegram.org": https://cloudflare-dns.com/dns-query

  # 当 DNS 请求通过代理链发出时使用的上游
  proxy-server-nameserver:
    - 'tls://dns.google'
    - 'https://doh.pub/dns-query'

