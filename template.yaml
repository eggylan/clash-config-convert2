proxy-groups:
  - name: Proxies
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/clasha.png
    proxies:
      - 自动选择
      - 故障转移
    <<: *use
  
  - name: YouTube
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/refs/heads/master/Social_Media/YouTube.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Netflix
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Netflix.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Telegram
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Telegram.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: TikTok
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Tiktok.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Disney
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Disney.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Steam
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Steam.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: PayPal
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Paypal.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: OpenAI
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/chatgpt.png
    exclude-filter: *OPENAI
    proxies:
      - Proxies
    <<: *use

  - name: Github
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Openhub.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Google
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Google.png
    exclude-filter: *GL
    proxies:
      - Proxies
    <<: *use

  - name: Microsoft
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/microsoft.png
    exclude-filter: *GL
    proxies:
      - DIRECT
      - Proxies
    <<: *use

  - name: Apple
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Apple.png
    exclude-filter: *GL
    proxies:
      - DIRECT
      - Proxies
    <<: *use

  - name: Binance
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/binance.png
    exclude-filter: *GL
    proxies:
      - DIRECT
      - Proxies
    <<: *use

  - name: Final
    type: select
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Yu.png
    proxies:
      - Proxies
      - DIRECT
    # Final组是用来兜底的，不需要注入订阅节点，默认指向 "Proxies" 组

  - name: 广告
    type: select
    proxies:
      - REJECT
      - DIRECT
      - Proxies
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/refs/heads/master/Universal/Reject.png
    # 广告组不需要注入订阅节点

  - name: 自动选择
    exclude-filter: *GL
    <<: *use
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 600
    timeout: 3000
    tolerance: 50
    # 懒惰开关，启用后，代表该策略组被使用时才会去测速
    lazy: true

  - name: 故障转移
    exclude-filter: *GL
    <<: *use
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 600

rules:
  # 强制 Cloudflare/Google 加密 DNS 走代理
  # --------------------------------------------------
  - DOMAIN,one.one.one.one,Proxies
  - DOMAIN,dns.google,Proxies
  - DOMAIN,cloudflare-dns.com,Proxies
  # --------------------------------------------------
  
  # 电报 FCM 相关服务强制走代理
  # --------------------------------------------------
  - DOMAIN-SUFFIX,firebaseio.com,Proxies
  - DOMAIN-SUFFIX,googleapis.com,Proxies
  - DOMAIN-SUFFIX,googleusercontent.com,Proxies
  - DOMAIN-SUFFIX,gstatic.com,Proxies
  # --------------------------------------------------
  
  # 私有IP
  - GEOIP,private,DIRECT,no-resolve

  # 直连白名单
  - 'DOMAIN,dns.alidns.com,DIRECT'
  - 'DOMAIN,doh.pub,DIRECT'
  - 'DOMAIN,alt1-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt1-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt2-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt3-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt4-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt5-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt6-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt7-mtalk.google.com,DIRECT'
  - 'DOMAIN,alt8-mtalk.google.com,DIRECT'
  - 'DOMAIN,mtalk.google.com,DIRECT'
  - 'DOMAIN,mtalk4.google.com,DIRECT'
  - 'DOMAIN,mtalk-staging.google.com,DIRECT'
  - 'DOMAIN,mtalk-dev.google.com,DIRECT'
  # 广告拦截
  - RULE-SET,秋风广告,广告
  # 代理组分流
  - 'DOMAIN-SUFFIX,trustwallet.com,Binance'
  - 'DOMAIN-SUFFIX,bnbchain.org,Binance'
  - 'DOMAIN-SUFFIX,bnbchain.dev,Binance'
  - 'DOMAIN-SUFFIX,bnscan.io,Binance'
  - 'DOMAIN-SUFFIX,bnacademy.org,Binance'
  - 'DOMAIN-SUFFIX,binancefuture.com,Binance'
  - 'DOMAIN-SUFFIX,bnappzh.co,Binance'
  - 'DOMAIN-SUFFIX,bnbzh.ac,Binance'
  - 'DOMAIN-SUFFIX,saasexch.info,Binance'
  - 'DOMAIN-SUFFIX,bnappweb.biz,Binance'
  - 'DOMAIN-SUFFIX,bnappcloud.com,Binance'
  - 'DOMAIN-SUFFIX,walletconnect.org,Binance'
  - 'DOMAIN-SUFFIX,m.api.forter.com,Binance'
  - 'DOMAIN-SUFFIX,report.bntrace.com,Binance'
  - GEOSITE,binance,Binance
  - GEOSITE,youtube,YouTube
  - GEOSITE,netflix,Netflix
  - GEOSITE,telegram,Telegram
  - GEOSITE,tiktok,TikTok
  - GEOSITE,disney,Disney
  - GEOSITE,steam,Steam
  - GEOSITE,paypal,PayPal
  - GEOSITE,openai,OpenAI
  - GEOSITE,apple,Apple
