# mihomo (Clash Meta) 懒人配置
# 版本 V0.4-20260402
# 仓库地址：https://github.com/eggylan/clash-config-convert
# 感谢clash懒人配置（https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33）和原仓库（https://github.com/lzcmaro/clash-config-convert）的贡献


# 延迟检测 URL  
p: &p  
  type: http  
  # 自动更新订阅时间，单位为秒  
  interval: 86400  
  # 订阅节点可用性检查  
  health-check:  
    enable: true  
    url: https://cp.cloudflare.com  
    # 节点连通性检测时间，单位为秒  
    interval: 1800  
    # 节点超时延迟，单位为毫秒  
    timeout: 2000  
    # 节点自动切换差值，单位为毫秒  
    tolerance: 300  
  
# 基础配置  
# --------------------------------------------------  
# 如果你是小白，那么你只需要修改分割线以内的内容  
# 其他部分保持不动即可  
  
# 也可以把分割线以内的内容粘贴到您使用代理工具的「覆写」功能，然后在覆写中进行修改  
# 使用覆写时可以直接将此配置文件作为订阅链接进行订阅  
# https://gist.githubusercontent.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/raw/config.yaml  
  
# 如果你需要使用大于两个机场，在下方 `use` 处添加 `订阅三` （名字可以自己取），然后在 `proxy-providers` 照例添加订阅链接即可  
# 反之，如果你只需要使用一个，那么将 `订阅二` 前添加 `#` 进行注释即可  
  
# 订阅名，记得修改成自己的  
# 添删订阅在这里和下方订阅链接依葫芦画瓢就行  
use: &use  
  type: select  
  use:  
    - {{SUB_NAME}} 
    # - 本地配置  
  
# 订阅链接  
# 对于订阅来说，path 为选填项，但建议启用  
# 本地配置可以只填 path  
proxy-providers:  
  "{{SUB_NAME}}":  
    <<: *p  
    # path: ./proxy_provider/订阅一.yaml  
    url: "{{SUB_URL}}"  
    # 如需要为该订阅组节点添加前缀，取消下面两行注释  
    # override:  
      # additional-prefix: "[订阅一]"  
  
  # 本地配置:  
    # <<: *p  
    # path: ./proxy_provider/本地配置.yaml  
    # 如需要为该订阅组节点添加前缀，取消下面两行注释  
    # override:  
      # additional-prefix: "[本地配置]"  
  
# 小白请不要继续随意修改以下设置  
# 若需修改请参阅文档 https://wiki.metacubex.one  
# --------------------------------------------------  
  
#节点过滤  
# --------------------------------------------------  
过滤节点: &GL "跳转|长期|导入|节点|流量|轮询|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|失联|到期|JC|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|页面|提示|特别|访问|支持|教程|关注|更新|作者|加入|.com|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author"  
openai: &OPENAI "香港|🇭🇰|HK|Hong|跳转|长期|导入|节点|流量|轮询|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|失联|到期|JC|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|页面|提示|特别|访问|支持|教程|关注|更新|作者|加入|.com|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author"  
# --------------------------------------------------  
  
# 规则订阅  
rule-providers:  
  # 秋风广告拦截规则  
  秋风广告:  
    type: http  
    # domain 纯域名格式 | classical 经典型模式，包含 DOMAIN-SUFFIX 等，主要看该规则集返回的数据格式  
    behavior: domain  
    format: yaml  
    # path可为空(仅限clash.meta 1.15.0以上版本)  
    path: ./rule_provider/AWAvenue-Ads.yaml  
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml"  
    # 更新周期：86400 秒（24小时）  
    interval: 86400  
  
mode: rule  
# ipv6 支持  
ipv6: false 
log-level: info  
# 允许局域网连接  
allow-lan: true  
# socks5/http 端口  
mixed-port: 7890  
# Meta 内核特性 https://wiki.metacubex.one/config/general  
# 统一延迟  
# 更换延迟计算方式,去除握手等额外延迟  
unified-delay: true  
# TCP 并发  
# 同时对所有ip进行连接，返回延迟最低的地址，但有被误判为攻击的风险
tcp-concurrent: false
# 外部控制端口  
external-controller: :9090  
  
geodata-mode: true  
  
# Geo 数据库下载地址  
# 源地址 https://github.com/MetaCubeX/meta-rules-dat  
# 可以更换镜像站但不要更换其他数据库，可能导致无法启动  
geox-url:  
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"  
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"  
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"  
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"  
  
# 进程匹配模式  
# 路由器上请设置为 off  
# always 开启，强制匹配所有进程  
# strict 默认，由 Clash 判断是否开启  
# off 不匹配进程，推荐在路由器上使用此模式  
find-process-mode: strict  
  
# 缓解移动设备耗电问题  
# https://github.com/vernesong/OpenClash/issues/2614  
keep-alive-interval: 1800  
  
# 全局客户端指纹  
global-client-fingerprint: chrome
  
# 缓存  
profile:  
  store-selected: true  
  store-fake-ip: true  

# 自动同步时间以防止时间不准导致无法正常联网
ntp:
  enable: true
  # 是否同步至系统时间，需要 root/管理员权限
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

# 域名嗅探
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# tun 模式  
tun:  
  enable: true  
  stack: mixed  
  endpoint-independent-nat: true  
  dns-hijack:  
    - "any:53"  
    - "tcp://any:53"  
  auto-route: true  
  auto-detect-interface: true  
  strict-route: true  
  
# dns 设置  
dns:  
  enable: true  
  ipv6: false  
  use-hosts: true  
  use-system-hosts: false
  # DOH 优先使用 http/3  
  prefer-h3: false  
  # DNS 请求是否进入路由/规则链  
  respect-rules: true 
  # 本地 DNS 监听端口，默认是 1053 端口  
  listen: 0.0.0.0:1053  
  # 可选缓存/TTL 设置，提高并发解析性能  
  cache-size: 4096  
  cache-ttl: 150
  enhanced-mode: fake-ip  
  
  direct-nameserver-follow-policy: false  
  
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist  
  fake-ip-filter:  
    - 'geosite:connectivity-check'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'  
    - '*.lan'  
    - '*.local'  
    - '*.arpa'  
    - 'time.*.com'  
    - 'ntp.*.com'  
    - '+.market.xiaomi.com'  
    - 'localhost.ptlogin2.qq.com'  
    - '*.msftncsi.com'  
    - 'www.msftconnecttest.com'  
    # FCM 相关服务，避免 fake-ip 误伤  
    - "*.googleapis.com"  
    - "*.googleusercontent.com"  
    - "*.gstatic.com"  
    - "*.telegram.org"  
  
  # 用于解析DNS服务器的DNS服务器  
  default-nameserver:  
    - 'system'  
    - '223.5.5.5'  
    - '218.201.96.130'  
    - '119.29.29.29'  
    - '180.184.1.1'
    - '[2402:4e00::]'
    - '[2400:3200::1]'  
  
  nameserver:  
    - 'tls://1.1.1.1#QUERY-DNS'  
    - 'tls://8.8.8.8#QUERY-DNS' # 强制走 DNS Over Proxy ，这里采用一个比较激进的策略，默认就用国外的dns解析，遇到国内网站会优先匹配到后面的geosite
    - 'tls://223.5.5.5#QUERY-DNS'  # 阿里云是有国际服务器的，对dns解析影响不大，同时解决订阅无法下载的问题
    - 'tls://[2001:4860:4860::8844]#QUERY-DNS'
    - 'tls://[2606:4700:4700::1001]#QUERY-DNS'
      
  # 特殊域名走专用解析策略  
  # 国际doh均使用ip，防止反复解析dns的域名  
  nameserver-policy:  
    'geosite:cn,private':  # 国内网站优先国内 DNS  
      - 'https://223.5.5.5/dns-query#China'  
      - 'https://doh.360.cn/dns-query#China'  
      - 'https://doh.pub/dns-query#China'  
    'geosite:gfw':  # 被墙网站走国际 DNS  
      - 'tls://1.1.1.1#QUERY-DNS'
      - 'tls://8.8.8.8#QUERY-DNS'
      - 'tls://[2001:4860:4860::8844]#QUERY-DNS'
      - 'tls://[2606:4700:4700::1001]#QUERY-DNS'   
    "geosite:!cn,!private": # 非国内网站走国际 DNS
      - "tls://8.8.8.8#QUERY-DNS"
      - "tls://1.1.1.1#QUERY-DNS"
      - 'tls://[2001:4860:4860::8844]#QUERY-DNS'
      - 'tls://[2606:4700:4700::1001]#QUERY-DNS'  
  
  # 用来解析代理服务器域名的 DNS 服务器  
  proxy-server-nameserver:  
    - 'https://doh.360.cn/dns-query'  
    - 'https://doh.pub/dns-query'  
    - 'https://dns.alidns.com/dns-query'  
    - 'tls://223.5.5.5'  
# 多入站端口设置  
# listeners:  
#   - name: hk  
#     type: mixed  
#     port: 12991  
#     proxy: 香港  
  
#   - name: tw  
#     type: mixed  
#     port: 12992  
#     proxy: 台湾  
  
#   - name: sg  
#     type: mixed  
#     port: 12993  
#     proxy: 新加坡  
  
proxies:  
  # - name: "WARP"  
  #   type: wireguard  
  #   server: engage.cloudflareclient.com  
  #   port: 2408  
  #   ip: "172.16.0.2/32"  
  #   ipv6: "2606::1/128"        # 自行替换  
  #   private-key: "private-key" # 自行替换  
  #   public-key: "public-key"   # 自行替换  
  #   udp: true  
  #   reserved: "abba"           # 自行替换  
  #   mtu: 1280  
  #   dialer-proxy: "WARP前置"  
  #   remote-dns-resolve: true  
  #   dns:  
  #     - https://dns.cloudflare.com/dns-query  
  
proxy-groups:  
  - name: Proxies
    exclude-filter: *GL  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/clasha.png  
    proxies:  
      - 自动选择  
      - 故障转移  
    <<: *use  
  
  - name: QUERY-DNS
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/dns_optimizer.png
    exclude-filter: *GL  
    proxies:  
      - Proxies  
      - DIRECT  
    <<: *use  
    
  - name: YouTube  
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/refs/heads/master/Social_Media/YouTube.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Twitter  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Twitter1.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Facebook  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Facebook.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Telegram  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Telegram.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: TikTok  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Tiktok.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Netflix  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Netflix.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Disney  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Disney.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Steam  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Steam.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use

  - name: SteamCN
    exclude-filter: *GL
    proxies:
      - DIRECT
      - Proxies
    <<: *use
  
  - name: PayPal  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Paypal.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: OpenAI  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/chatgpt.png  
    exclude-filter: *OPENAI  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Github  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Openhub.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Google  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Google.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
    <<: *use  
  
  - name: Microsoft  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/microsoft.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
      - DIRECT  
    <<: *use  
  
  - name: Apple  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Apple.png  
    exclude-filter: *GL  
    proxies:  
      - DIRECT  
      - Proxies  
    <<: *use  
  
  - name: Binance  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/binance.png  
    exclude-filter: *GL  
    proxies:  
      - Proxies  
      - DIRECT  
    <<: *use  
  
  - name: Final  
    type: select  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/Yu.png  
    proxies:  
      - Proxies  
      - DIRECT  
    # Final组是用来兜底的，不需要注入订阅节点，默认指向 "Proxies" 组  

  - name: China  
    type: select  
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/China.png  
    proxies:  
      - DIRECT  
      - Proxies  
    # China组是用来处理国内流量的，不需要注入订阅节点，默认指向 "DIRECT" 组
  
  - name: 广告  
    type: select  
    proxies:  
      - REJECT  
      - DIRECT  
      - Proxies  
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/refs/heads/master/Universal/Reject.png  
    # 广告组不需要注入订阅节点  
  
  - name: 自动选择  
    exclude-filter: *GL  
    <<: *use  
    type: url-test  
    url: 'https://www.gstatic.com/generate_204'  
    interval: 600  
    timeout: 3000  
    tolerance: 50  
    # 懒惰开关，启用后，代表该策略组被使用时才会去测速  
    lazy: true  
  
  - name: 故障转移  
    exclude-filter: *GL  
    <<: *use  
    type: fallback  
    url: 'https://www.gstatic.com/generate_204'  
    interval: 600  
  
rules: 
  # 若需禁用 QUIC 请取消注释 QUIC 两条规则
  # 防止 YouTube 等使用 QUIC 导致速度不佳, 禁用 443 端口 UDP 流量（不包括国内）
  # 注意：可能会导致部分网站无法正常工作，开启前请自行评估风险
  # - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOSITE,cn))),REJECT
  # - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOIP,CN))),REJECT 

  # 绕过局域网地址和私有ip
  - GEOIP,private,DIRECT,no-resolve  
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

  # FCM 相关服务强制走代理  
  # --------------------------------------------------  
  - DOMAIN-SUFFIX,firebaseio.com,Google
  - DOMAIN-SUFFIX,googleapis.com,Google
  - DOMAIN-SUFFIX,googleusercontent.com,Google
  - DOMAIN-SUFFIX,gstatic.com,Google
  - 'DOMAIN,mtalk.google.com,Google'
  - 'DOMAIN-KEYWORD,mtalk,Google'
  # --------------------------------------------------  
  
  # DNS直连白名单  
  - 'DOMAIN,dns.alidns.com,China'  
  - 'DOMAIN,doh.pub,China'
  - 'DOMAIN,doh.360.cn,China'  

  # 广告拦截  
  - RULE-SET,秋风广告,广告  

  # 代理组分流  
  - 'DOMAIN-SUFFIX,trustwallet.com,Binance'  
  - 'DOMAIN-SUFFIX,bnbchain.org,Binance'  
  - 'DOMAIN-SUFFIX,bnbchain.dev,Binance'  
  - 'DOMAIN-SUFFIX,bnscan.io,Binance'  
  - 'DOMAIN-SUFFIX,bnacademy.org,Binance'  
  - 'DOMAIN-SUFFIX,binancefuture.com,Binance'  
  - 'DOMAIN-SUFFIX,bnappzh.co,Binance'  
  - 'DOMAIN-SUFFIX,bnbzh.ac,Binance'  
  - 'DOMAIN-SUFFIX,saasexch.info,Binance'  
  - 'DOMAIN-SUFFIX,bnappweb.biz,Binance'  
  - 'DOMAIN-SUFFIX,bnappcloud.com,Binance'  
  - 'DOMAIN-SUFFIX,walletconnect.org,Binance'  
  - 'DOMAIN-SUFFIX,m.api.forter.com,Binance'  
  - 'DOMAIN-SUFFIX,report.bntrace.com,Binance'  
  - GEOSITE,binance,Binance  
  - GEOSITE,youtube,YouTube  
  - GEOSITE,twitter,Twitter  
  - GEOSITE,facebook,Facebook  
  - GEOSITE,telegram,Telegram  
  - GEOSITE,tiktok,TikTok  
  - GEOSITE,netflix,Netflix  
  - GEOSITE,disney,Disney
  - GEOSITE,steam@cn,SteamCN
  - GEOSITE,steam,Steam
  - GEOSITE,paypal,PayPal  
  - GEOSITE,openai,OpenAI  
  - GEOSITE,apple,Apple  
  - GEOSITE,apple-cn,Apple  
  - GEOSITE,github,Github  
  - GEOSITE,microsoft,Microsoft # geosite microsoft 会包括一些其它域名，比如 github 等，这里需要放后面一些  
  - GEOSITE,google,Google  
  - GEOSITE,google-cn,Google # Google CN 不走代理会导致香港等地区节点 Play Store 异常  
  - GEOIP,google,Google  
  - GEOIP,telegram,Telegram
  - GEOSITE,gfw,Proxies  
  # 本地和国内域名  
  - DOMAIN-SUFFIX,local,DIRECT  
  - DOMAIN-SUFFIX,cn,China
  - GEOSITE,CN,China
  - GEOIP,CN,China 
  # 漏网之鱼
  - MATCH,Final